        /* --- NAVBAR --- */
        .topnav {
            position: fixed; top: 10px; left: 20px; right: 20px;
            border-radius: 15px; padding: 10px 20px; z-index: 999;
            display: flex; justify-content: space-between; align-items: center;

            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .nav-left { display: flex; align-items: center; gap: 15px; }
        
        /* Logo Styling - Circular */
        .nav-logo {
            width: 36px; height: 36px; 
            background: #fff; 
            border-radius: 50%; /* Makes it circular */
            object-fit: contain;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--bg-gradient-start);
            border: 2px solid white;
        }
        
        .nav-title { color: white; font-size: 1.2rem; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .nav-right { display: flex; gap: 5px; align-items: center; }
        .topnav a, .dropbtn { color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; transition: all 0.3s ease; font-weight: 500; font-family: var(--main-font); font-size: 1rem; border:none; background: transparent; cursor: pointer; }
        .topnav a:hover, .dropdown:hover .dropbtn { background: var(--primary-color); transform: translateY(-2px); }

        /* Dropdown */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; right: 0;
            background-color: #02133e; min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1000; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden; margin-top: 0px;
        }
        .dropdown-content::before {
            content: "";
            display: block;
            position: absolute;
            top: -20px; /* Move up to overlap the gap */
            left: 0;
            width: 100%;
            height: 20px; /* Height sufficient to bridge the gap */
            background: transparent; /* Keep it invisible */
        }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: block; text-align: left; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a:hover { background-color: var(--primary-color); }

        /* --- MOBILE SIDE NAV (The Slide-in Menu) --- */
        .sidenav {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: #182a69; /* Requested Color */
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }

        .sidenav a, .sidenav .sidenav-header {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 1.2rem;
            color: #f1f1f1;
            display: block;
            transition: 0.3s;
            font-family: var(--main-font);
        }

        .sidenav a:hover {
            color: var(secondary-color);
            background: rgba(255,255,255,0.1);
        }

        /* Close Button (Cross) Styling */
        .sidenav .closebtn {
            position: absolute;
            top: 15px;       /* Moved slightly down */
            right: 20px;     /* Positioned top right */
            font-size: 24px; /* Made smaller */
            margin-left: 0;
            padding: 0;      /* Removed padding */
        }

        /* Remove the background hover effect specifically for the close button */
        .sidenav .closebtn:hover {
            background: none; 
            color: #ccc;
        }

        .sidenav-divider {
            border-top: 1px solid rgba(255,255,255,0.2);
            margin: 10px 20px;
        }

        .sidenav-subitem {
            font-size: 1rem !important;
            padding-left: 50px !important;
            opacity: 0.9;
        }

        /* Hamburger Icon */
        .hamburger {
            display: none; /* Hidden on desktop */
            font-size: 28px;
            cursor: pointer;
            color: white;
            margin-right: 15px;
            user-select: none;
        }

        /* --- CONTAINER & ACTIONS --- */
        .container { max-width: 1200px; margin: 100px auto 40px; padding: 20px; }
        
        .action-area {
            display: grid; grid-template-columns: 2fr 1fr; gap: 30px;
            margin-bottom: 60px; height: 350px;
        }

        /* Big Button */
        .big-action-btn {
            background: white; border-radius: 20px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); text-decoration: none;
            position: relative; overflow: hidden;
        }
        .big-action-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); background: #fdfdfd; }
        .plus-icon { font-size: 8rem; color: var(--primary-color); line-height: 1; margin-bottom: 10px; }
        .action-label { font-size: 1.5rem; color: #182a69; font-weight: bold; }

        /* Small Buttons Column */
        .small-actions-col { display: flex; flex-direction: column; gap: 20px; height: 100%; }
        .small-action-btn {
            flex: 1; background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.1rem; font-weight: bold; text-decoration: none;
            transition: all 0.3s; backdrop-filter: blur(5px);
        }
        .small-action-btn:hover { background: var(--primary-color); border-color: var(--primary-color); transform: translateX(-5px); }

        /* --- PROJECTS GRID --- */
        .projects-header {
            color: white; font-size: 2rem; margin-bottom: 25px; padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .projects-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;
        }
        .project-card {
            background: white; border-radius: 15px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); transition: transform 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 100px; position: relative; overflow: hidden;
            max-height:200px;
        }
        .project-card:hover { transform: translateY(-5px); }

        .project-title { font-size: 1.4rem; color: #182a69; margin-bottom: 5px; font-weight: bold; }
        .project-date { color: #888; font-size: 0.9rem; margin-bottom: 15px; }
        
        /* SVG Preview Area */
        .project-preview {
            flex-grow: 1; background: #f0f0f5; border-radius: 8px; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid #eee;
        }
        .project-preview svg { width: 100%; height: 100%; object-fit: contain; }

        /* Hover Overlay for Delete/Download */
        .card-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(24, 42, 105, 0.9);
            display: flex; justify-content: center; align-items: center; gap: 15px;
            opacity: 0; transition: opacity 0.3s ease; border-radius: 15px;
        }
        .project-card:hover .card-overlay { opacity: 1; }

        .icon-btn {
            background: white; color: var(--primary-color); border: none;
            width: 50px; height: 50px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s; text-decoration: none;
        }
        .icon-btn:hover { transform: scale(1.1); background: #f0f0f5; }
        .btn-label { font-size: 0.8rem; margin-top: 5px; color: white; text-align: center; }
        .overlay-action { display: flex; flex-direction: column; align-items: center; }

    <script>
        // Mobile nav handled by components/header.js

        // --- STORAGE LOGIC ---
        // We use localStorage key 'vc_projects'
        // Format: Array of objects [{id, name, date, content (svg string), type}]

        const STORAGE_KEY = 'vc_projects';

        function getProjects() {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        }

        function saveProjects(projects) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
        }

        function deleteProject(id) {
            if(!confirm("Are you sure you want to delete this project?")) return;
            const projects = getProjects();
            const filtered = projects.filter(p => p.id != id);
            saveProjects(filtered);
            renderProjects();
        }

        function downloadProject(id) {
            const projects = getProjects();
            const proj = projects.find(p => p.id == id);
            if(proj && proj.content) {
                const blob = new Blob([proj.content], {type: 'image/svg+xml'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (proj.name || 'project') + '.svg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        function renderProjects() {
            const grid = document.getElementById('projects-grid');
            const projects = getProjects();
            
            grid.innerHTML = '';

            if(projects.length === 0) {
                grid.innerHTML = '<div class="empty-state">No projects saved yet. Create or Generate one!</div>';
                return;
            }

            // Sort by date descending
            projects.sort((a,b) => b.id - a.id);

            projects.forEach(proj => {
                const dateStr = new Date(proj.id).toLocaleDateString() + ' ' + new Date(proj.id).toLocaleTimeString();
                
                // Card HTML
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div>
                        <div class="project-title">${proj.name || 'Untitled Project'}</div>
                        <div class="project-date">${dateStr}</div>
                        <div class="project-preview">${proj.content}</div> <!-- SVG renders here -->
                    </div>
                    
                    <!-- Overlay for actions -->
                    <div class="card-overlay">
                        <div class="overlay-action">
                            <button class="icon-btn" onclick="downloadProject(${proj.id})">⬇</button>
                            <div class="btn-label">Download</div>
                        </div>
                        <div class="overlay-action">
                            <button class="icon-btn" style="color:red;" onclick="deleteProject(${proj.id})">🗑</button>
                            <div class="btn-label">Delete</div>
                        </div>
                        <div class="overlay-action">
                            <a href="editor_5.8.html?pid=${proj.id}" target="_blank" class="icon-btn">✎</a>

                            <div class="btn-label">Open</div>
                        </div>
                    </div>
                `;

                // Fix SVG scaling in preview
                const svgEl = card.querySelector('svg');
                if(svgEl) {
                    svgEl.setAttribute('width', '100%');
                    svgEl.setAttribute('height', '100%');
                    svgEl.removeAttribute('style'); // Clear specific dimensions
                }

                grid.appendChild(card);
            });
        }

        // Init
        document.addEventListener('DOMContentLoaded', renderProjects);

    </script>
