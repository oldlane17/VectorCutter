    <script>
        /* =========================================
           USER CONFIGURATION: CUSTOM LASH FOLDER
           ========================================= */
        const LASH_FOLDER = "./lashes/"; 

        const LASH_FILES = [
            "lash1.svg"
            
        ];

        /* =========================================
           INTERNAL FALLBACK (If folder fails)
           ========================================= */
        const FALLBACK_LASHES = [
            { id: "default_round", width: 100, d: "M 0 0 C 30 0, 30 20, 30 20 C 30 35, 20 40, 50 40 C 80 40, 70 35, 70 20 C 70 20, 70 0, 100 0" },
            { id: "default_square", width: 100, d: "M 0 0 L 25 0 L 25 35 L 75 35 L 75 0 L 100 0" },
            { id: "default_triangle", width: 100, d: "M 0 0 L 30 0 L 50 35 L 70 0 L 100 0" }
        ];

        /* --- GLOBAL VARIABLES --- */
        let loadedLashData = []; 
        let currentAspectRatio = 0;
        let imageBase64 = null;
        let currentSvgBlobUrl = null;

        /* --- SETUP & HELPERS --- */
        function sfc32(a, b, c, d) {
            return function() {
                a |= 0; b |= 0; c |= 0; d |= 0; 
                var t = (a + b | 0) + d | 0;
                d = d + 1 | 0;
                a = b ^ b >>> 9;
                b = c + (c << 3) | 0;
                c = (c << 21 | c >>> 11);
                c = c + t | 0;
                return (t >>> 0) / 4294967296;
            }
        }

        async function loadExternalLashes() {
            const tempLashes = [];
            const parser = new DOMParser();

            console.log(`Attempting to load ${LASH_FILES.length} files from ${LASH_FOLDER}...`);

            for (let filename of LASH_FILES) {
                try {
                    const response = await fetch(LASH_FOLDER + filename);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const text = await response.text();
                    const doc = parser.parseFromString(text, "image/svg+xml");
                    
                    const svgEl = doc.querySelector('svg');
                    let viewBox = svgEl.getAttribute('viewBox');
                    let nativeWidth = 100;
                    if(viewBox) {
                        const parts = viewBox.split(/[\s,]+/).map(parseFloat);
                        if(parts.length === 4) nativeWidth = parts[2];
                    } else {
                        const w = svgEl.getAttribute('width');
                        if(w) nativeWidth = parseFloat(w);
                    }

                    const pathEl = doc.querySelector('path');
                    if (pathEl) {
                        const d = pathEl.getAttribute('d');
                        tempLashes.push({ id: filename, width: nativeWidth, d: d });
                    }
                } catch (err) {
                    console.warn(`Could not load ${filename}:`, err);
                }
            }
            return tempLashes;
        }

        /* --- GENERATOR LOGIC --- */
        async function generatePuzzle() {
            document.getElementById('loading-spinner').style.display = 'block';
            document.getElementById('btn-icon').style.display = 'none';

            loadedLashData = await loadExternalLashes();
            
            if (loadedLashData.length === 0) {
                console.log("Using internal fallback lashes.");
                loadedLashData = FALLBACK_LASHES;
            }

            const width = parseFloat(document.getElementById('width_mm').value);
            const height = parseFloat(document.getElementById('height_mm').value);
            const cols = parseInt(document.getElementById('col_count').value);
            const rows = parseInt(document.getElementById('row_count').value);
            const seedInput = parseInt(document.getElementById('seed_val').value) || 12345;
            const rand = sfc32(seedInput, seedInput, seedInput, seedInput);
            
            const pieceW = width / cols;
            const pieceH = height / rows;

            let vEdges = []; 
            for(let x=0; x<=cols; x++) {
                vEdges[x] = [];
                for(let y=0; y<rows; y++) {
                    if(x===0 || x===cols) vEdges[x][y] = 0; 
                    else vEdges[x][y] = (rand() > 0.5) ? 1 : -1;
                }
            }

            let hEdges = [];
            for(let x=0; x<cols; x++) {
                hEdges[x] = [];
                for(let y=0; y<=rows; y++) {
                    if(y===0 || y===rows) hEdges[x][y] = 0; 
                    else hEdges[x][y] = (rand() > 0.5) ? 1 : -1;
                }
            }

            let innerSvgContent = "";
            const getRandomLash = () => loadedLashData[Math.floor(rand() * loadedLashData.length)];
            const GAP_START_PCT = 0.36;
            const GAP_END_PCT = 0.64;
            const GAP_WIDTH_PCT = GAP_END_PCT - GAP_START_PCT;

            // Horizontal Edges
            for(let y=1; y<rows; y++) {
                for(let x=0; x<cols; x++) {
                    const absX = x * pieceW;
                    const absY = y * pieceH;
                    const sign = hEdges[x][y];
                    
                    if (sign === 0) {
                        innerSvgContent += `<line x1="${absX}" y1="${absY}" x2="${absX+pieceW}" y2="${absY}" class="cut-line" />`;
                    } else {
                        innerSvgContent += `<line x1="${absX}" y1="${absY}" x2="${absX + (pieceW*GAP_START_PCT)}" y2="${absY}" class="cut-line" />`;
                        const lash = getRandomLash();
                        const targetWidth = pieceW * GAP_WIDTH_PCT;
                        const scale = targetWidth / lash.width;
                        const startX = absX + (pieceW * GAP_START_PCT);
                        const startY = absY;
                        let transform = "";
                        if (sign === 1) {
                            transform = `translate(${startX}, ${startY}) scale(${scale})`;
                        } else {
                            const endGapX = absX + (pieceW * GAP_END_PCT);
                            transform = `translate(${endGapX}, ${startY}) rotate(180) scale(${scale})`;
                        }
                        innerSvgContent += `<path d="${lash.d}" transform="${transform}" class="cut-line" />`;
                        innerSvgContent += `<line x1="${absX + (pieceW*GAP_END_PCT)}" y1="${absY}" x2="${absX + pieceW}" y2="${absY}" class="cut-line" />`;
                    }
                }
            }

            // Vertical Edges
            for(let x=1; x<cols; x++) {
                for(let y=0; y<rows; y++) {
                    const absX = x * pieceW;
                    const absY = y * pieceH;
                    const sign = vEdges[x][y];

                    if (sign === 0) {
                        innerSvgContent += `<line x1="${absX}" y1="${absY}" x2="${absX}" y2="${absY+pieceH}" class="cut-line" />`;
                    } else {
                        innerSvgContent += `<line x1="${absX}" y1="${absY}" x2="${absX}" y2="${absY + (pieceH*GAP_START_PCT)}" class="cut-line" />`;
                        const lash = getRandomLash();
                        const targetLen = pieceH * GAP_WIDTH_PCT;
                        const scale = targetLen / lash.width;
                        let transform = "";
                        const startGapY = absY + (pieceH * GAP_START_PCT);
                        const endGapY = absY + (pieceH * GAP_END_PCT);

                        if (sign === 1) {
                            transform = `translate(${absX}, ${startGapY}) rotate(90) scale(${scale})`;
                        } else {
                            transform = `translate(${absX}, ${endGapY}) rotate(-90) scale(${scale})`;
                        }
                        innerSvgContent += `<path d="${lash.d}" transform="${transform}" class="cut-line" />`;
                        innerSvgContent += `<line x1="${absX}" y1="${absY + (pieceH*GAP_END_PCT)}" x2="${absX}" y2="${absY + pieceH}" class="cut-line" />`;
                    }
                }
            }

            const borderPath = `M 0 0 L ${width} 0 L ${width} ${height} L 0 ${height} Z`;
            const opacity = document.getElementById('imgOpacity').value;

            const fullSvg = `
<svg xmlns="http://www.w3.org/2000/svg" width="${width}mm" height="${height}mm" viewBox="0 0 ${width} ${height}">
    <defs>
        <style> 
            .cut-line { fill: none; stroke: red; stroke-width: 0.1mm; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; } 
            .border-line { fill: none; stroke: blue; stroke-width: 0.1mm; vector-effect: non-scaling-stroke; }
        </style>
    </defs>
    ${imageBase64 ? `<image id="preview-bg-image" href="${imageBase64}" x="0" y="0" width="${width}" height="${height}" preserveAspectRatio="none" style="opacity:${opacity}" />` : ''}
    <g id="cut-layer">
        <path d="${borderPath}" class="border-line" />
        ${innerSvgContent}
    </g>
</svg>`;

            // Update Preview
            document.getElementById('preview-container').innerHTML = fullSvg;
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('btn-icon').style.display = 'block';

            // --- SAVE TO DASHBOARD (IMPLEMENTED HERE) ---
            try {
                // We name it "Puzzle [Width]x[Height]mm" so you can identify it in the editor
                saveGeneratedProjectToDashboard(fullSvg, `Puzzle ${Math.round(width)}x${Math.round(height)}mm`);
                console.log("Project saved to dashboard successfully.");
            } catch(e) {
                console.warn("Storage Error: Could not save to Editor dashboard (Local Storage full or disabled).", e);
            }

            // Setup Manual Download
            if (currentSvgBlobUrl) URL.revokeObjectURL(currentSvgBlobUrl);
            const blob = new Blob([fullSvg], {type: 'image/svg+xml'});
            currentSvgBlobUrl = URL.createObjectURL(blob);
            
            const dlBtn = document.getElementById('download-link');
            dlBtn.href = currentSvgBlobUrl;
            dlBtn.download = `custom_puzzle_${width}x${height}.svg`;
            dlBtn.style.display = 'inline-block';
        }

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                imageBase64 = event.target.result;
                const img = new Image();
                img.onload = function() {
                    currentAspectRatio = img.width / img.height;
                    const w = parseFloat(document.getElementById('width_mm').value) || 200;
                    document.getElementById('height_mm').value = (w / currentAspectRatio).toFixed(2);
                    generatePuzzle(); 
                };
                img.src = imageBase64;
            };
            reader.readAsDataURL(file);
        });
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }

        // --- UI UTILS ---
        function toggleCollapsible(wrapperId, checkboxId, populateFunc) {
            const wrapper = document.getElementById(wrapperId);
            const checkbox = document.getElementById(checkboxId);
            
            if (checkbox.checked) {
                if(populateFunc) populateFunc();
                wrapper.classList.add("open");
            } else {
                wrapper.classList.remove("open");
            }
        }

        function randomizeSeed() {
            document.getElementById('seed_val').value = Math.floor(Math.random() * 90000) + 10000;
            generatePuzzle();
        }

        function updateOpacity() {
            const el = document.getElementById('preview-bg-image');
            if(el) el.style.opacity = document.getElementById('imgOpacity').value;
        }

        // --- DASHBOARD SAVING FUNCTION ---
        function saveGeneratedProjectToDashboard(svgString, baseName) {
            // Get existing projects or initialize empty array
            const projects = JSON.parse(localStorage.getItem('vc_projects') || '[]');
            
            // Create new project object
            const newProject = {
                id: Date.now(),
                name: baseName,
                type: 'generator',
                content: svgString
            };
            
            // Save back to Local Storage
            projects.push(newProject);
            localStorage.setItem('vc_projects', JSON.stringify(projects));
        }
    

    </script>
</body>
</html>
