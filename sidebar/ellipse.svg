<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 
    cx/cy: Center point (12,12 is center of 24x24 grid)
    rx: Horizontal radius (10px wide)
    ry: Vertical radius (6px tall) - making it look like an ellipse
    stroke-width: 2 (Matches Material Symbols Outlined weight)
  -->
  <ellipse cx="12" cy="12" rx="10" ry="6" stroke="black" stroke-width="2"/>
</svg>