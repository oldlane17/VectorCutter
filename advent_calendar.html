        /* --- STYLING --- */
        :root{
            --main-font:'Roboto', Tahoma, Geneva, Verdana, sans-serif;
            --primary-color:#182a69;

            font-family: var(--main-font);
            overflow-x: hidden;
        }

        /* --- NAVBAR (From Index) --- */
        .topnav {
            position: fixed; top: 10px; left: 20px; right: 20px;
            border-radius: 15px; padding: 10px 20px; z-index: 999;
            display: flex; justify-content: space-between; align-items: center;
            background-color: #182a6995; backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .nav-left { display: flex; align-items: center; gap: 15px; }
        
        /* Logo Styling - Circular */
        .nav-logo {
            width: 36px; height: 36px; 
            background: #fff; 
            border-radius: 50%; 
            object-fit: contain;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--bg-gradient-start);
            border: 2px solid white;
        }
        
        .nav-title { color: white; font-size: 1.2rem; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .nav-right { display: flex; gap: 5px; align-items: center; }
        .topnav a, .dropbtn { color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; transition: all 0.3s ease; font-weight: 500; font-family: var(--main-font); font-size: 1rem; border:none; background: transparent; cursor: pointer; }
        .topnav a:hover, .dropdown:hover .dropbtn { background: var(--primary-color); transform: translateY(-2px); }

        /* Dropdown */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; right: 0;
            background-color: #02133e; min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1000; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden; margin-top: 0px;
            transition: 0.3s;
        }
        .dropdown-content::before {
            content: "";
            display: block;
            position: absolute;
            top: -20px; /* Move up to overlap the gap */
            left: 0;
            width: 100%;
            height: 20px; /* Height sufficient to bridge the gap */
            background: transparent; /* Keep it invisible */
        }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: block; text-align: left; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a:hover { background-color: var(--primary-color); }

        /* --- MOBILE SIDE NAV (The Slide-in Menu) --- */
        .sidenav {
            height: 100%; width: 0; position: fixed; z-index: 2000;
            top: 0; left: 0; background-color: #182a69;
            overflow-x: hidden; transition: 0.5s; padding-top: 60px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }

        .sidenav a, .sidenav .sidenav-header {
            padding: 8px 8px 8px 32px; text-decoration: none; font-size: 1.2rem;
            color: #f1f1f1; display: block; transition: 0.3s; font-family: var(--main-font);
        }

        .sidenav a:hover { color: var(secondary-color); background: rgba(255,255,255,0.1); }
        .sidenav .closebtn {
            position: absolute; top: 15px; right: 20px;

        .sidenav .closebtn:hover { background: none; color: #ccc; }
        .sidenav-divider { border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 20px; }
        .sidenav-subitem { font-size: 1rem !important; padding-left: 50px !important; opacity: 0.9; }

        /* Hamburger Icon */
        .hamburger {
            display: none; font-size: 28px; cursor: pointer; color: white;
            margin-right: 15px; user-select: none;
        }

        /* --- GENERATOR LAYOUT --- */
        .container { max-width: 1200px; margin: 100px auto 40px; padding: 20px; }

        .action-area {
            display: grid; grid-template-columns: 2fr 1fr; gap: 30px;

        .settings-container { display: flex; flex-direction: column; gap: 20px; height: 100%; }
        .setting-card {
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2);

        /* Action Button */
        .big-action-btn {
            background: white; border-radius: 20px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;

    <script>
        /* --- MOBILE NAV LOGIC (Added) --- */
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }

        // --- GLOBAL STATE ---
        let loadedFont = null;
        let loadedFontName = "";
        let currentPresetUrl = "";

        // --- PRESETS ---
        const formats = { "A3": [420, 297], "A4": [297, 210], "A5": [210, 148] };
        
        // Font URLs (Using reliable CDNs for open source fonts)
        const fontPresets = {
            'preset_sans': 'https://cdn.jsdelivr.net/npm/@fontsource/roboto/files/roboto-latin-700-normal.woff', // Roboto Bold
            'preset_serif': 'https://cdn.jsdelivr.net/npm/@fontsource/crimson-pro/files/crimson-pro-latin-700-normal.woff', // Crimson Pro Bold
            'preset_cursive': 'https://cdn.jsdelivr.net/npm/@fontsource/mountains-of-christmas/files/mountains-of-christmas-latin-700-normal.woff', // Thematic
            'preset_bold': 'https://cdn.jsdelivr.net/npm/@fontsource/oswald/files/oswald-latin-700-normal.woff' // Oswald
        };

        // --- STICK FONTS (Hardcoded) ---
        const stencilSegments = {
            top: "M 1 0 L 9 0 L 8 2 L 2 2 Z", mid: "M 2 9 L 8 9 L 9 10 L 8 11 L 2 11 L 1 10 Z", bot: "M 2 18 L 8 18 L 9 20 L 1 20 Z",
            tl: "M 0 1 L 2 3 L 2 8 L 0 9 Z", tr: "M 10 1 L 8 3 L 8 8 L 10 9 Z", bl: "M 0 11 L 2 12 L 2 17 L 0 19 Z", br: "M 10 11 L 8 12 L 8 17 L 10 19 Z"
        };
        const vectorFonts = {
            modern: { '0': "M 2 0 L 8 0 L 10 2 L 10 18 L 8 20 L 2 20 L 0 18 L 0 2 L 2 0 Z", '1': "M 5 0 L 5 20", '2': "M 0 5 L 2 0 L 8 0 L 10 5 L 10 7 L 0 20 L 10 20", '3': "M 0 2 L 2 0 L 8 0 L 10 2 L 10 8 L 8 10 L 2 10 M 8 10 L 10 12 L 10 18 L 8 20 L 2 20 L 0 18", '4': "M 8 20 L 8 0 L 0 12 L 10 12", '5': "M 10 0 L 0 0 L 0 8 L 2 8 L 8 8 L 10 10 L 10 18 L 8 20 L 2 20 L 0 18", '6': "M 10 2 L 8 0 L 2 0 L 0 2 L 0 18 L 2 20 L 8 20 L 10 18 L 10 10 L 8 8 L 0 8", '7': "M 0 0 L 10 0 L 2 20", '8': "M 5 10 L 8 8 L 10 5 L 10 2 L 8 0 L 2 0 L 0 2 L 0 5 L 2 8 L 8 12 L 10 15 L 10 18 L 8 20 L 2 20 L 0 18 L 0 15 L 2 12 Z", '9': "M 0 18 L 2 20 L 8 20 L 10 18 L 10 2 L 8 0 L 2 0 L 0 2 L 0 10 L 2 12 L 10 12" },
            rounded: { '0': "M 5 0 Q 10 0 10 5 L 10 15 Q 10 20 5 20 Q 0 20 0 15 L 0 5 Q 0 0 5 0 Z", '1': "M 4 2 L 5 0 L 5 20", '2': "M 1 5 Q 1 0 5 0 Q 10 0 10 5 Q 10 9 5 13 L 0 20 L 10 20", '3': "M 1 2 Q 1 0 5 0 Q 10 0 10 5 Q 10 8 7 9 Q 10 10 10 15 Q 10 20 5 20 Q 0 20 0 18", '4': "M 8 20 L 8 0 L 0 14 L 10 14", '5': "M 9 0 L 1 0 L 1 9 Q 1 7 5 7 Q 10 7 10 13 Q 10 20 5 20 Q 1 20 0 17", '6': "M 9 2 Q 7 0 5 0 Q 0 0 0 10 Q 0 20 5 20 Q 10 20 10 15 Q 10 10 5 10 Q 1 10 0 13", '7': "M 0 2 Q 0 0 2 0 L 10 0 L 4 20", '8': "M 5 10 Q 9 10 9 5 Q 9 0 5 0 Q 1 0 1 5 Q 1 10 5 10 Q 10 10 10 15 Q 10 20 5 20 Q 0 20 0 15 Q 0 10 5 10 Z", '9': "M 1 18 Q 3 20 5 20 Q 10 20 10 10 Q 10 0 5 0 Q 0 0 0 5 Q 0 10 5 10 Q 9 10 10 7" },
            serif: { '0': "M 5 0 L 9 2 L 9 18 L 5 20 L 1 18 L 1 2 L 5 0 Z M 1 2 L 9 18", '1': "M 2 20 L 8 20 M 5 20 L 5 0 L 2 2", '2': "M 1 4 L 1 2 L 5 0 L 9 2 L 9 5 L 1 20 L 10 20", '3': "M 1 2 L 2 0 L 8 0 L 10 2 L 8 9 L 10 11 L 10 18 L 8 20 L 2 20 L 1 18", '4': "M 7 20 L 7 0 L 0 14 L 10 14", '5': "M 10 0 L 2 0 L 1 8 L 2 8 Q 10 6 10 14 Q 10 20 2 20 L 0 18", '6': "M 9 2 L 5 0 L 1 5 L 1 15 L 5 20 L 9 15 L 9 12 L 5 10 L 1 13", '7': "M 0 0 L 10 0 L 5 20", '8': "M 5 10 L 8 8 L 9 4 L 5 0 L 1 4 L 2 8 L 5 10 L 8 12 L 9 16 L 5 20 L 1 16 L 2 12 Z", '9': "M 1 18 L 5 20 L 9 15 L 9 5 L 5 0 L 1 5 L 1 8 L 5 10 L 9 7" },
            stencil: { '0': ['top','tl','tr','bl','br','bot'], '1': ['tr','br'], '2': ['top','tr','mid','bl','bot'], '3': ['top','tr','mid','br','bot'], '4': ['tl','mid','tr','br'], '5': ['top','tl','mid','br','bot'], '6': ['top','tl','mid','bl','br','bot'], '7': ['top','tr','br'], '8': ['top','tl','tr','mid','bl','br','bot'], '9': ['top','tl','tr','mid','br','bot'] }
        };

        // --- UI LOGIC ---
        function updateDimensions() {
            const format = document.getElementById("paper_format").value;
            const wInput = document.getElementById("sheet_width");
            const hInput = document.getElementById("sheet_height");
            if (format === "Custom") { wInput.disabled = false; hInput.disabled = false; }
            else { wInput.disabled = true; hInput.disabled = true; wInput.value = formats[format][0]; hInput.value = formats[format][1]; }
        }

        function toggleFontUI() {
            const val = document.getElementById("font_style").value;
            const customUi = document.getElementById("custom-font-ui");
            const modeUi = document.getElementById("font-mode-ui");

            // Show Upload if custom
            if (val === "custom") customUi.classList.remove("hidden");
            else customUi.classList.add("hidden");

            // Show Cut/Engrave option if NOT using Stick/Stencil (which have fixed modes)
            if (val.startsWith("preset_") || val === "custom") {
                modeUi.classList.remove("hidden");
            } else {
                modeUi.classList.add("hidden");
            }
        }

        // --- FILE UPLOAD (Custom) ---
        document.getElementById('font_file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const buffer = e.target.result;
                    loadedFont = opentype.parse(buffer);
                    loadedFontName = file.name;
                    alert("Custom font loaded successfully!");
                } catch (err) { alert("Error parsing font: " + err); }
            };
            reader.readAsArrayBuffer(file);
        });

        // --- FETCH PRESET FONT ---
        async function loadPresetFont(presetKey) {
            const url = fontPresets[presetKey];
            if (currentPresetUrl === url && loadedFont) return; // Already loaded

            // Fetch as ArrayBuffer
            const response = await fetch(url);
            const buffer = await response.arrayBuffer();
            loadedFont = opentype.parse(buffer);
            currentPresetUrl = url;
            loadedFontName = presetKey;
        }

        // --- PATH HELPERS ---
        function parseAndScale(pathD, startX, startY, scale) {
            const commands = pathD.split(/(?=[MLQZ])/);
            let charPath = "";
            commands.forEach(cmd => {
                const type = cmd.trim()[0];
                const coordsStr = cmd.substring(1).trim();
                if (type === 'Z') charPath += " Z";
                else if (coordsStr.length > 0) {
                    const coords = coordsStr.split(/\s+/).map(Number);
                    if (type === 'M' || type === 'L') {
                        const lx = (coords[0] * scale) + startX; const ly = (coords[1] * scale) + startY;
                        charPath += ` ${type} ${lx.toFixed(2)} ${ly.toFixed(2)}`;
                    } else if (type === 'Q') {
                        const c1x = (coords[0] * scale) + startX; const c1y = (coords[1] * scale) + startY;
                        const lx = (coords[2] * scale) + startX; const ly = (coords[3] * scale) + startY;
                        charPath += ` Q ${c1x.toFixed(2)} ${c1y.toFixed(2)} ${lx.toFixed(2)} ${ly.toFixed(2)}`;
                    }
                }
            });
            return charPath;
        }

        function getPerforatedLinePath(x, y, length, dashLen = 2, gapLen = 1) {
            let d = ""; let currentY = y; const endY = y + length;
            while (currentY < endY) {
                let nextY = currentY + dashLen; if (nextY > endY) nextY = endY;
                d += `M ${x} ${currentY} L ${x} ${nextY} `; currentY = nextY + gapLen;
            }
            return d;
        }

        // --- GET NUMBER PATH ---
        function getNumberPath(number, cx, cy, fontSize, style) {
            const strNum = number.toString();

            // A) OPENTYPE (Preset or Custom)
            if (style === 'custom' || style.startsWith('preset_')) {
                if (!loadedFont) return ""; 
                // Metrics
                const textWidth = loadedFont.getAdvanceWidth(strNum, fontSize);
                const startX = cx - (textWidth / 2);
                const startY = cy + (fontSize / 3); // Vertical center approx
                // Convert to Path
                const path = loadedFont.getPath(strNum, startX, startY, fontSize);
                return path.toPathData(2);
            }

            // B) STICK FONTS
            const scale = fontSize / 20; 
            const charWidth = 10 * scale; 
            const spacing = 4 * scale; 
            const totalWidth = (strNum.length * charWidth) + ((strNum.length - 1) * spacing);
            let startX = cx - (totalWidth / 2);
            let startY = cy - (fontSize / 2);
            let combinedPath = "";

            if (style === 'stencil') {
                const glyphs = vectorFonts['stencil'];
                for (let i = 0; i < strNum.length; i++) {
                    const char = strNum[i];
                    (glyphs[char] || []).forEach(seg => { combinedPath += parseAndScale(stencilSegments[seg], startX, startY, scale); });
                    startX += charWidth + spacing;
                }
            } else {
                const glyphs = vectorFonts[style];
                for (let i = 0; i < strNum.length; i++) {
                    const char = strNum[i];
                    if (glyphs[char]) combinedPath += parseAndScale(glyphs[char], startX, startY, scale);
                    startX += charWidth + spacing;
                }
            }
            return combinedPath;
        }

        // --- MAIN GENERATOR ---
        async function generateCalendar() {
            // UI Loading State
            const btn = document.getElementById("generate-btn");
            const spinner = document.getElementById("loading-spinner");
            const icon = document.getElementById("btn-icon");
            spinner.style.display = "block"; icon.style.display = "none";
            btn.style.cursor = "wait";

            try {
                const width = parseFloat(document.getElementById("sheet_width").value);
                const height = parseFloat(document.getElementById("sheet_height").value);
                const doorSize = parseFloat(document.getElementById("door_size").value);
                const hasTab = document.getElementById("pull_tab").checked;
                const tabRadius = parseFloat(document.getElementById("tab_radius").value);
                const orderType = document.getElementById("number_order").value;
                const fontSize = parseFloat(document.getElementById("font_size").value);
                const fontStyle = document.getElementById("font_style").value;
                const outlineCut = document.getElementById("font_outline_cut").checked;

                // Load font if Preset
                if (fontStyle.startsWith('preset_')) {
                    await loadPresetFont(fontStyle);
                } else if (fontStyle === 'custom' && !loadedFont) {
                    alert("Please upload a font file first!");
                    throw new Error("No font");
                }

                let numbers = Array.from({length: 24}, (_, i) => i + 1);
                function shuffle(array) {
                    let currentIndex = array.length, randomIndex;
                    while (currentIndex != 0) {
                        randomIndex = Math.floor(Math.random() * currentIndex);
                        currentIndex--;
                        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                    }
                }
                if (orderType === "random") shuffle(numbers);

                let cols = 6; let rows = 4;
                if (height > width) { cols = 4; rows = 6; }
                const marginX = width * 0.1; const marginY = height * 0.1;
                const availableW = width - (2 * marginX); const availableH = height - (2 * marginY);
                const gapX = (availableW - (cols * doorSize)) / (cols - 1);
                const gapY = (availableH - (rows * doorSize)) / (rows - 1);

                let svgContent = "";
                let gridPositions = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        gridPositions.push({ x: marginX + (c * (doorSize + gapX)), y: marginY + (r * (doorSize + gapY)) });
                    }
                }

                if (orderType === "ordered_bt") {
                    gridPositions.sort((a, b) => { if (Math.abs(a.y - b.y) > 0.1) return b.y - a.y; return a.x - b.x; });
                }

                gridPositions.forEach((pos, index) => {
                    const num = numbers[index];
                    const cx = pos.x + doorSize / 2; const cy = pos.y + doorSize / 2;
                    const x = pos.x; const y = pos.y; const s = doorSize;

                    // Door Cut
                    let cutPathD = "";
                    if (!hasTab) cutPathD = `M ${x} ${y} L ${x+s} ${y} L ${x+s} ${y+s} L ${x} ${y+s}`;
                    else {
                        const midY = y + (s/2); const tabR = tabRadius;
                        cutPathD = `M ${x} ${y} L ${x+s} ${y} L ${x+s} ${midY - tabR} A ${tabR} ${tabR} 0 1 1 ${x+s} ${midY + tabR} L ${x+s} ${y+s} L ${x} ${y+s}`;
                    }
                    svgContent += `<path d="${cutPathD}" fill="none" stroke="red" stroke-width="0.1" />`; 

                    // Hinge
                    const hingePath = getPerforatedLinePath(x, y, s, 2, 1); 
                    svgContent += `<path d="${hingePath}" fill="none" stroke="blue" stroke-width="0.1" />`;

                    // Number
                    const numPath = getNumberPath(num, cx, cy, fontSize, fontStyle);
                    
                    if (fontStyle === 'stencil') {
                        svgContent += `<path d="${numPath}" fill="none" stroke="red" stroke-width="0.1" />`;
                    } else if (fontStyle === 'custom' || fontStyle.startsWith('preset_')) {
                        if (outlineCut) svgContent += `<path d="${numPath}" fill="none" stroke="red" stroke-width="0.1" />`;
                        else svgContent += `<path d="${numPath}" fill="none" stroke="black" stroke-width="0.1" />`; // Standard fonts use fill-like outline for engrave
                    } else {
                        svgContent += `<path d="${numPath}" fill="none" stroke="black" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" />`;
                    }
                });

                const svgOutput = `
<svg xmlns="http://www.w3.org/2000/svg" width="${width}mm" height="${height}mm" viewBox="0 0 ${width} ${height}">
    <title>Advent Calendar</title>
    <rect x="0" y="0" width="${width}" height="${height}" fill="white" stroke="none"/>
    <rect x="0" y="0" width="${width}" height="${height}" fill="none" stroke="red" stroke-width="0.1" />
    ${svgContent}
</svg>`;

                document.getElementById("preview-container").innerHTML = svgOutput;
                window.lastGeneratedSVG = svgOutput;
                saveGeneratedProjectToDashboard(svgOutput, "Advent Calendar");

            } catch(e) {
                console.error(e);
            } finally {
                // Restore UI
                spinner.style.display = "none"; icon.style.display = "block";
                btn.style.cursor = "pointer";
            }
            
        }

        function downloadSVG(content, fileName) {
            const blob = new Blob([content], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
        function saveGeneratedProjectToDashboard(svgString, baseName) {
            const projects = JSON.parse(localStorage.getItem('vc_projects') || '[]');
            
            const newProject = {
                id: Date.now(),
                name: baseName,
                type: 'generator',
                content: svgString
            };

            projects.push(newProject);
            localStorage.setItem('vc_projects', JSON.stringify(projects));
        }



        document.getElementById('generate-btn').onclick = async function() {
            await generateCalendar();
            if(window.lastGeneratedSVG) {
                const width = document.getElementById("sheet_width").value;
                const height = document.getElementById("sheet_height").value;
                downloadSVG(window.lastGeneratedSVG, `LaserAdvent_${width}x${height}.svg`);
            }
        };

        updateDimensions();
        toggleFontUI();
    </script>
</body>
